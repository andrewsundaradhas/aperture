name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # `datasets` brings pyarrow/av/pillow, so the LeRobot v3 reader tests run instead of skipping.
      - name: Install
        run: pip install -e ".[dev,datasets]"
      - name: Test
        run: pytest -q -p no:warnings

  # The production database path. Everything above runs on SQLite, which has no row-level
  # security — three production-only bugs (signup, post-commit reads, the job worker) passed it.
  # This suite connects as the restricted `aperture_api` role against real Postgres + pgvector.
  postgres:
    name: Postgres + RLS integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aperture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      APERTURE_TEST_PG_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/aperture_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q -p no:warnings tests/test_postgres_rls.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  ml:
    name: ML training tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # The base API install (no `[ml]` extra) is enough: these tests exercise the dataset
      # reader and the failure-surface construction, and only import `aperture.ml.runtime`
      # for its SURFACES constant — no torch, so the job stays fast.
      - name: Install
        run: pip install -e "apps/api" pytest pillow
      - name: Test
        run: pytest -q -p no:warnings
        working-directory: ml
      # The classifier benchmark is only worth anything if it still runs. Regenerate it and
      # fail if the committed report is stale.
      - name: Classifier benchmark is reproducible
        run: |
          python -m eval.run_eval
          git diff --exit-code ../docs/classifier_eval.md
        working-directory: ml
