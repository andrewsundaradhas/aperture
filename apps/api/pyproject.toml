[project]
name = "aperture-api"
version = "0.1.0"
description = "Aperture — evaluation & interpretability layer for VLA robot policies (FastAPI backend)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "boto3>=1.34",           # S3-compatible client for Cloudflare R2
    "psycopg2-binary>=2.9",  # Postgres driver (Supabase); SQLite used by default locally
    "sentry-sdk[fastapi]>=2.0",  # error/observability (free tier); inert without a DSN
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Real dataset ingestion: LeRobot v3 (parquet + mp4) and image encoding. RLDS TFRecord needs
# nothing extra — that reader is pure stdlib. Without this extra the API still ingests the
# legacy JSON encoding and RLDS .tfrecord, and returns a clear 4xx for LeRobot archives.
datasets = [
    "pyarrow>=14.0",   # LeRobot v3 parquet tables
    "av>=11.0",        # mp4 frame decode
    "pillow>=10.0",    # frame -> PNG for the blob store
]
# Learned-model inference (AperturePolicy + FailureHead). Optional and heavy — the base API
# runs without it and falls back to the heuristic/simulated path. Install with:
#   pip install -e ".[ml]"   and set APERTURE_USE_LEARNED_MODELS=true
ml = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "sentence-transformers>=3.0",
    "huggingface_hub>=0.24",
    "pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aperture*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
