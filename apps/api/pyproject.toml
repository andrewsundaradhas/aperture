[project]
name = "aperture-api"
version = "0.1.0"
description = "Aperture — evaluation & interpretability layer for VLA robot policies (FastAPI backend)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "boto3>=1.34",           # S3-compatible client for Cloudflare R2
    "psycopg2-binary>=2.9",  # Postgres driver (Supabase); SQLite used by default locally
    "sentry-sdk[fastapi]>=2.0",  # error/observability (free tier); inert without a DSN
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aperture*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
